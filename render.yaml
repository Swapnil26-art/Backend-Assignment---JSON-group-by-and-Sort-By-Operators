services:
  - type: web
    name: json-dataset-api
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/json-dataset-api-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
